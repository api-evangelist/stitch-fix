name: Stitch Fix
description: 'Stitch Fix is an online personal styling service that pairs data science and
  machine learning with expert human stylists to send customers curated shipments ("Fixes") of
  apparel, footwear, and accessories selected to their size, budget, and style preferences.
  Founded in 2011 and publicly traded (NASDAQ: SFIX), the company operates a direct-to-consumer
  retail model across womens, mens, and kids categories. Stitch Fix does not publish a public
  developer API or developer portal; its engineering team shares its data-science and platform
  work through the Multithreaded technology blog and open-source projects on GitHub. This profile
  captures the company''s public web, security, and engineering surfaces.'
